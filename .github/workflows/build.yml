name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ranant.csproj

    - name: Build Release
      run: msbuild ranant.csproj /p:Configuration=Release /p:Platform=AnyCPU /p:PlatformTarget=AnyCPU

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ranant-Release
        path: bin/Release/*.exe
        if-no-files-found: error
